[project]
name = "nota"
version = "0.1.0"
description = "Node-based data analysis backend on polars"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "behaviz>=0.6.2",
    "pingouin>=0.6.1",
    "polars==1.32.3",
    "pyarrow>=15",       # polars <-> pandas bridge for the pingouin stats nodes
]

[project.optional-dependencies]
viz = ["networkx>=3", "matplotlib>=3.7"]
io = ["fastexcel>=0.10"]   # source.excel
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["covers(kind): marks a behavioral test as covering a builtin node kind"]

[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nota*"]
exclude = ["notebooks*", "res*", "build*", "*.egg-info*", "tests*"]
